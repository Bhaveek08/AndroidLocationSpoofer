name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_emulator_tests:
        description: Run the slower Android 16 mock-provider integration suite
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build, lint, and run unit tests
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease packageDebugAndroidTest
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  emulator-tests:
    # The device suite needs a real Android runtime: it registers mock providers, reads the fixes
    # back, and drives a simulated route. It is opt-in because it takes several minutes.
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify mock providers, routing, and the simulated drive on Android 16
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -o pipefail
            ./gradlew installDebug installDebugAndroidTest
            adb shell cmd location set-location-enabled true
            adb shell appops set dev.codex.locationlab android:mock_location allow
            adb shell am instrument -w -r dev.codex.locationlab.test/androidx.test.runner.AndroidJUnitRunner \
              2>&1 | tee instrument.log
            # `am instrument` exits 0 even when tests fail or the app process crashes, so the run
            # is only a pass if the runner printed an OK summary and reported no failures.
            if grep -qE 'FAILURES!!!|Process crashed|INSTRUMENTATION_STATUS_CODE: -[12]$' instrument.log \
               || ! grep -qE 'OK \([0-9]+ tests?\)' instrument.log; then
              echo "::error::Instrumentation tests failed; see the log below."
              sed -n '/INSTRUMENTATION_RESULT/,$p' instrument.log
              exit 1
            fi
