name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_emulator_tests:
        description: Run the slower Android 16 mock-provider integration suite
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build, lint, and run unit tests
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug packageDebugAndroidTest
      - name: Verify mock providers and background service on Android 16
        if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            ./gradlew installDebug installDebugAndroidTest
            adb shell cmd location set-location-enabled true
            adb shell appops set dev.codex.locationlab android:mock_location allow
            adb shell am instrument -w -r dev.codex.locationlab.test/androidx.test.runner.AndroidJUnitRunner
