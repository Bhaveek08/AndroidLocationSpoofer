name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify and assemble release APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug packageDebugAndroidTest
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/debug/app-debug.apk --title "Location Lab $GITHUB_REF_NAME" --generate-notes
