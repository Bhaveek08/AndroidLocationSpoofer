name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify
        run: ./gradlew testDebugUnitTest lintDebug packageDebugAndroidTest

      # A release key is optional. With the four GEOSHIFT_* secrets set, the published APK is
      # signed with a stable key so Android accepts it as an update over an earlier install.
      # Without them the debug APK is published instead, and its key changes between runs.
      - name: Build the publishable APK
        id: apk
        env:
          GEOSHIFT_KEYSTORE_BASE64: ${{ secrets.GEOSHIFT_KEYSTORE_BASE64 }}
          GEOSHIFT_STORE_PASSWORD: ${{ secrets.GEOSHIFT_STORE_PASSWORD }}
          GEOSHIFT_KEY_ALIAS: ${{ secrets.GEOSHIFT_KEY_ALIAS }}
          GEOSHIFT_KEY_PASSWORD: ${{ secrets.GEOSHIFT_KEY_PASSWORD }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${GEOSHIFT_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$GEOSHIFT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/geoshift.jks"
            GEOSHIFT_STORE_FILE="$RUNNER_TEMP/geoshift.jks" ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "GeoShift-$VERSION.apk"
            echo "asset=GeoShift-$VERSION.apk" >> "$GITHUB_OUTPUT"
            echo "signing=a stable release key, so Android accepts it as an update over an earlier GeoShift install" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "GeoShift-$VERSION-debug.apk"
            echo "asset=GeoShift-$VERSION-debug.apk" >> "$GITHUB_OUTPUT"
            echo "signing=a throwaway debug key generated by this CI run. Uninstall an older GeoShift first if Android reports a signature conflict, and export your saved places beforehand" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Install the attached APK on a device you control, then:

          1. Enable **Developer options**, and select **GeoShift** under **Select mock location app**.
          2. Grant precise location when prompted, and keep Android Location on.
          3. If an app still shows your real area, turn off **Google Location Accuracy** and Wi-Fi/Bluetooth scanning in Android Location settings. GeoShift cannot override those signals.

          Mock locations are flagged as mock by Android; apps can detect them or place you from Wi-Fi, cell, IP, or account signals instead.
          NOTES
          printf '\nThis APK is signed with %s.\n' "${{ steps.apk.outputs.signing }}" >> notes.md
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${{ steps.apk.outputs.asset }}" --clobber
          else
            gh release create "$VERSION" "${{ steps.apk.outputs.asset }}" \
              --title "GeoShift $VERSION" --notes-file notes.md
          fi
